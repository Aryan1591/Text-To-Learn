name: Backend CI

on:
  push:
    paths:
      - "server/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "server/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build backend
        working-directory: server
        run: mvn -DskipTests package

