server:
  port: ${PORT:5000}

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: text-to-learn-api
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/text_to_learn}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH0_ISSUER_URI:}

app:
  client-origin: ${CLIENT_ORIGIN:http://localhost:5173}
  auth0-audience: ${AUTH0_AUDIENCE:https://text-to-learn-api}
  gemini-api-key: ${GEMINI_API_KEY:}
  gemini-model: ${GEMINI_MODEL:gemini-1.5-flash}
  openai-api-key: ${OPENAI_API_KEY:}
  youtube-api-key: ${YOUTUBE_API_KEY:}
